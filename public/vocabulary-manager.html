<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Words - Flashcards</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#c17743" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="icons/ios/180.png?v=2" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/ios/152.png?v=2" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/ios/167.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/ios/180.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/ios/192.png?v=2" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/ios/32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/ios/16.png?v=2" />

    <link rel="stylesheet" href="src/ui/styles.css" />
    <!-- Add this script to detect page type before loading any other scripts -->
    <script>
      window.isVocabManagerPage = true;
      // Ensure body class is set for vocabulary manager page
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("vocab-manager-page");
      });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
      // Registers the service worker for offline use. It never reloads the page: pages are
      // always fetched from the network first, and a new worker clears the old cache when it
      // activates, so the next navigation picks up an update by itself. (Reloading on
      // "controllerchange" used to refresh every first visit, and again after each deploy.)
      if (
        "serviceWorker" in navigator &&
        (location.protocol === "http:" || location.protocol === "https:")
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.log("ServiceWorker registration failed: ", err);
          });
        });
      }
    </script>
  </head>
  <body class="vocab-manager-page">
    <!-- Sign-in screen, shown until a Google account is signed in -->
    <div id="authGate" class="auth-gate">
      <div class="auth-loading">
        <div class="spinner"></div>
      </div>
      <div class="auth-card">
        <div class="lang-switcher" data-lang-switcher></div>
        <h1 data-i18n="app.title">Flashcards</h1>
        <p class="subtitle" data-i18n="auth.tagline">
          Your personal vocabulary collection. Add your own words, then learn
          them with flashcards and quizzes on any device.
        </p>
        <button id="googleSignInBtn" class="google-signin-btn">
          <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span data-i18n="auth.signIn">Sign in with Google</span>
        </button>
        <p id="authError" class="auth-error"></p>
      </div>
    </div>

    <div class="app-container">
      <header class="topbar">
        <a
          href="index.html"
          class="icon-btn"
          data-i18n-label="words.back"
          aria-label="Back to Study"
          title="Back to Study"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        </a>
        <h1 class="topbar-title" data-i18n="words.title">My Words</h1>
        <div class="topbar-actions">
          <div class="lang-dropdown" data-lang-switcher="select"></div>
          <div id="userChip" class="user-chip"></div>
        </div>
      </header>

      <!-- Add one word at a time -->
      <section class="panel">
        <h2 class="panel-title" data-i18n="words.addTitle">Add a Word</h2>
        <form id="addWordForm" class="add-word-form" autocomplete="off">
          <input
            type="text"
            id="newWord"
            placeholder="Word"
            data-i18n-placeholder="words.wordPlaceholder"
            maxlength="200"
            autocapitalize="none"
            required
          />
          <input
            type="text"
            id="newTranslation"
            placeholder="Translation"
            data-i18n-placeholder="words.translationPlaceholder"
            maxlength="500"
            autocapitalize="none"
            lang="ru"
          />
          <button type="submit" id="addWordBtn" class="primary-btn" data-i18n="words.add">
            Add
          </button>
        </form>
      </section>

      <!-- The signed-in user's collection -->
      <section class="panel">
        <h2 class="panel-title">
          <span data-i18n="words.collection">My Collection</span>
          <span id="wordCount" class="word-count"></span>
        </h2>
        <ul id="wordList" class="word-list"></ul>
      </section>

      <div id="messageContainer" class="toast-container" aria-live="polite"></div>
    </div>

    <script src="src/ui/i18n.js"></script>
    <script type="module" src="src/core/cloud.js"></script>
    <script src="src/ui/auth-gate.js"></script>
    <script src="src/ui/confirm-button.js"></script>
    <script src="src/utils/pwa-installer.js"></script>
    <script src="src/utils/cache-manager.js"></script>
    <script src="src/utils/version-sync.js"></script>
    <script src="src/features/vocabulary-manager/word-manager.js"></script>
  </body>
</html>
