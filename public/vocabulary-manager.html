<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Words - Flashcards</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#c17743" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="icons/ios/152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/ios/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/ios/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/ios/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/ios/192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/ios/32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/ios/16.png" />

    <link rel="stylesheet" href="src/ui/styles.css" />
    <!-- Add this script to detect page type before loading any other scripts -->
    <script>
      window.isVocabManagerPage = true;
      // Ensure body class is set for vocabulary manager page
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("vocab-manager-page");
      });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
      // Only register service worker if served over HTTP/HTTPS
      if (
        "serviceWorker" in navigator &&
        (location.protocol === "http:" || location.protocol === "https:")
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js")
            .then(function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope
              );

              // Check for updates only on initial load
              registration.update().catch((err) => {
                console.log("Service worker update check failed:", err);
              });

              // Handle updates
              registration.addEventListener("updatefound", function () {
                const newWorker = registration.installing;
                console.log("New service worker found, installing...");

                newWorker.addEventListener("statechange", function () {
                  if (newWorker.state === "installed") {
                    if (navigator.serviceWorker.controller) {
                      // New update available
                      console.log(
                        "New content is available; prompting for refresh."
                      );

                      // Show update notification
                      if (
                        confirm(
                          "A new version is available! Would you like to refresh to get the latest features and vocabulary?"
                        )
                      ) {
                        // Tell the new service worker to skip waiting
                        newWorker.postMessage({ type: "SKIP_WAITING" });

                        // Reload the page
                        window.location.reload();
                      }
                    } else {
                      // Content is cached for the first time
                      console.log("Content is cached for offline use.");
                    }
                  }
                });
              });

              // Listen for controlling changes
              navigator.serviceWorker.addEventListener(
                "controllerchange",
                () => {
                  console.log(
                    "Service worker controller changed, reloading..."
                  );
                  window.location.reload();
                }
              );

              // Listen for messages from service worker
              navigator.serviceWorker.addEventListener("message", (event) => {
                if (event.data && event.data.type === "CACHE_UPDATED") {
                  console.log("Cache updated to:", event.data.cacheName);
                } else if (event.data && event.data.type === "CACHE_CLEARED") {
                  console.log("Cache cleared successfully");
                }
              });
            })
            .catch(function (err) {
              console.log("ServiceWorker registration failed: ", err);
            });
        });
      } else if (location.protocol === "file:") {
        console.info(
          "PWA features disabled: Please serve this app over HTTP/HTTPS for full PWA functionality. Run 'python3 -m http.server 8082' and visit http://localhost:8082"
        );
      }
    </script>
  </head>
  <body class="vocab-manager-page">
    <!-- Sign-in screen, shown until a Google account is signed in -->
    <div id="authGate" class="auth-gate">
      <div class="auth-loading">
        <div class="spinner"></div>
      </div>
      <div class="auth-card">
        <h1>Flashcards</h1>
        <p class="subtitle">
          Your personal vocabulary collection. Add your own words, then learn
          them with flashcards and quizzes on any device.
        </p>
        <button id="googleSignInBtn" class="google-signin-btn">
          <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>
        <p id="authError" class="auth-error"></p>
      </div>
    </div>

    <div class="app-container">
      <div class="header">
        <div id="userChip" class="user-chip"></div>
        <h1>
          My Words
          <span class="version-badge" id="vocab-manager-version">v...</span>
        </h1>

        <a href="index.html" class="back-to-main-link">← Back to Study</a>
      </div>

      <div class="vocab-manager-container">
        <!-- Add one word at a time -->
        <section class="expand-vocabulary-section add-word-section">
          <h2>Add a Word</h2>
          <form id="addWordForm" class="add-word-form" autocomplete="off">
            <input
              type="text"
              id="newWord"
              placeholder="Word"
              maxlength="200"
              required
            />
            <input
              type="text"
              id="newTranslation"
              placeholder="Перевод (optional)"
              maxlength="500"
              lang="ru"
            />
            <button type="submit" id="addWordBtn" class="primary-btn">
              Add
            </button>
          </form>
          <div id="messageContainer"></div>
        </section>

        <!-- The signed-in user's collection -->
        <section class="current-vocabulary-section">
          <h2>My Collection <span id="wordCount" class="word-count"></span></h2>
          <div class="vocab-table-container">
            <table class="vocab-table">
              <thead>
                <tr>
                  <th>Word</th>
                  <th>Перевод</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="vocabTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="src/core/cloud.js"></script>
    <script src="src/ui/auth-gate.js"></script>
    <script src="src/utils/pwa-installer.js"></script>
    <script src="src/utils/cache-manager.js"></script>
    <script src="src/utils/version-sync.js"></script>
    <script src="src/features/vocabulary-manager/word-manager.js"></script>
  </body>
</html>
